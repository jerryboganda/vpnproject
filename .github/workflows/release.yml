name: Release Applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Companion
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows Binaries
        run: |
          cargo build --release -p vpnbridge-windows-app -p vpnbridge-gateway -p traffic-generator -p echo-server -p dns-test-server

      - name: Package Windows Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item target/release/vpnbridge-windows-app.exe dist-windows/
          Copy-Item target/release/echo-server.exe dist-windows/ -ErrorAction SilentlyContinue
          Copy-Item target/release/traffic-generator.exe dist-windows/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist-windows/* -DestinationPath vpnbridge-windows-x86_64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnbridge-windows
          path: vpnbridge-windows-x86_64.zip

  build-android:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Android Native Core Libs
        run: |
          cargo build --release -p vpnbridge-android-netbind -p vpnbridge-gateway -p vpnbridge-core

      - name: Package Android Bundle
        run: |
          mkdir -p dist-android
          echo "VPNBridge Android Native Gateway Core Ready" > dist-android/README.txt
          tar -czf vpnbridge-android-bundle.tar.gz dist-android/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnbridge-android
          path: vpnbridge-android-bundle.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: vpnbridge-windows
          path: ./release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: vpnbridge-android
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: VPNBridge ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
