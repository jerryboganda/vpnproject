name: Release Applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Companion
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows Binaries
        run: |
          cargo build --release -p vpnbridge-windows-app -p vpnbridge-gateway -p traffic-generator -p echo-server -p dns-test-server

      - name: Package Windows Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item target/release/vpnbridge-windows-app.exe dist-windows/
          Copy-Item target/release/echo-server.exe dist-windows/ -ErrorAction SilentlyContinue
          Copy-Item target/release/traffic-generator.exe dist-windows/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist-windows/* -DestinationPath vpnbridge-windows-x86_64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnbridge-windows
          path: vpnbridge-windows-x86_64.zip

  build-android:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Android Native Core Libs
        run: |
          cargo build --release -p vpnbridge-android-netbind -p vpnbridge-gateway -p vpnbridge-core

      - name: Build Android APK with Gradle
        working-directory: apps/android/android-native
        run: |
          gradle assembleRelease assembleDebug

      - name: Package Android APK
        shell: bash
        run: |
          mkdir -p dist-android
          find apps/android/android-native/build/outputs/apk -name "*.apk" -exec cp {} dist-android/ \; || true
          
          # Create primary release APK file
          RELEASE_APK=$(find dist-android/ -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" vpnbridge-android.apk
          else
            DEBUG_APK=$(find dist-android/ -name "*debug*.apk" | head -n 1)
            if [ -n "$DEBUG_APK" ]; then
              cp "$DEBUG_APK" vpnbridge-android.apk
            fi
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnbridge-android-apk
          path: vpnbridge-android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: vpnbridge-windows
          path: ./release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: vpnbridge-android-apk
          path: ./release-assets

      - name: Publish Release with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          echo "Publishing release $TAG_NAME..."
          gh release delete "$TAG_NAME" -y || true
          FILES=$(find ./release-assets -maxdepth 1 -type f)
          echo "Found release files:"
          echo "$FILES"
          gh release create "$TAG_NAME" $FILES \
            --title "VPNBridge $TAG_NAME" \
            --generate-notes
